# Clippy lint configuration for Geello

# Enable additional lints
warn-on-all = true

# Style
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 8
type-complexity-threshold = 300

# Allow specific lints that are too restrictive
allow-dbg-in-tests = true
allow-print-stdout = true
allow-unwrap-used = true

# Disallow specific patterns
disallowed-methods = [
    # Prefer structured errors over panic
    "std::process::exit",
]
disallowed-types = [
    # Phase 1 migration: use GeelloError instead of String
    # "std::string::String",
]
