<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geello · 地图服务预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/ol.css">
  <link rel="stylesheet" href="preview.css">
  <script src="vendor/ol.js" defer></script>
  <script src="preview-ol.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Geello 首页"><span class="brand-icon">G</span> geello <span class="brand-divider"></span><span class="subtitle">地图服务预览</span></a>
    <div class="top-actions"><span id="connection" class="badge">正在连接</span><a href="/service/api.html" target="_blank" rel="noopener">接口文档 ↗</a></div>
  </header>
  <div class="workspace">
    <aside>
      <div class="eyebrow">MAP EXPLORER</div>
      <h1>已发布的地图</h1>
      <p class="intro">选择地图，探索服务实时渲染的空间数据。</p>
      <div class="section-head"><span>地图列表 <span id="count" class="count">0</span></span><button id="refresh" class="text-button" type="button">刷新 ↻</button></div>
      <div id="map-list" class="map-list" aria-label="已发布地图"><p class="muted">正在读取地图…</p></div>
      <div class="settings">
        <label for="protocol">预览方式</label>
        <select id="protocol"><option value="ogc">OGC API · Maps（图片）</option><option value="wmts">WMTS · 瓦片</option><option value="wms">WMS 1.3.0（图片）</option><option value="wfs">WFS 2.0 · 矢量要素</option></select>
        <label for="crs">坐标系</label><select id="crs"></select>
        <label for="time">动画时间 / 秒</label>
        <div class="input-row"><input id="time" type="number" min="0" step="0.1" value="0"><button id="apply-time" type="button">应用</button></div>
      </div>
      <section id="feature-panel" hidden>
        <label for="feature-type">LXMC 类型</label>
        <select id="feature-type"><option value="">全部类型</option></select>
        <div id="feature-legend" class="feature-legend"></div>
        <p class="muted" id="feature-summary">WFS 模式可点击面边线查看属性。</p>
        <details id="feature-details" hidden><summary>选中要素属性</summary><div id="feature-properties"></div></details>
      </section>
      <details class="bounds-details"><summary>自定义经纬度范围</summary>
        <form id="bounds-form">
          <div class="bounds-fields"><label>西经 / °<input name="west" type="number" step="any" value="70" required></label><label>南纬 / °<input name="south" type="number" step="any" value="15" required></label><label>东经 / °<input name="east" type="number" step="any" value="140" required></label><label>北纬 / °<input name="north" type="number" step="any" value="55" required></label></div>
          <button class="wide" type="submit">定位到范围</button>
        </form>
      </details>
      <div class="server-info"><span class="server-dot"></span><div>地图服务<p id="server-url">—</p><small id="backend">读取服务状态…</small></div></div>
    </aside>
    <main>
      <div class="map-heading"><div><div class="eyebrow">LIVE MAP</div><h2 id="map-title">地图预览</h2></div><a id="metadata" target="_blank" rel="noopener" hidden>查看地图信息 ↗</a></div>
      <div class="presets"><span>快速定位</span><button data-bounds="70,15,140,55">中国</button><button data-bounds="-179,-80,179,80">世界</button><button data-bounds="110,30,125,45">京沪区域</button><button id="reset">重置视图</button></div>
      <div id="viewport" tabindex="0" role="region" aria-label="交互地图，可拖动、滚轮缩放或使用方向键平移">
        <div id="ol-map" aria-label="OpenLayers 交互地图"></div>
        <div class="map-tools"><button id="zoom-in" aria-label="放大地图" title="放大">+</button><button id="zoom-out" aria-label="缩小地图" title="缩小">−</button></div>
        <div id="notice" class="notice" role="status">正在连接地图服务…</div>
        <div class="map-caption">GEELLO <span>实时地图服务</span></div>
        <div id="pointer" class="pointer">拖动平移 · 滚轮缩放</div>
      </div>
      <div class="statusbar"><span id="render-status" role="status">等待读取地图</span><span id="view-info">—</span></div>
      <details class="request-details"><summary>当前地图请求</summary><div><a id="request-link" target="_blank" rel="noopener">选择地图后查看请求</a><button id="copy" type="button">复制链接</button></div></details>
      <p class="hint">画面来自已发布的地图服务。没有看到数据时，可切换快速定位或输入数据所在范围。</p>
    </main>
  </div>
</body>
</html>
