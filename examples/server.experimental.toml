# Temporary compatibility profile. These values are not production defaults;
# G-07 requires measured workloads and explicit owner approval.
listen = "127.0.0.1:3000"
public_base_url = "http://127.0.0.1:3000"
data_directory = "../assets/test/m3-server-data"
external_roots = []
backend = "gpu-preferred"

[profile]
max_upload_bytes = 16777216
max_expanded_bytes = 33554432
max_archive_files = 8
max_member_bytes = 16777216
max_compression_ratio = 100
max_registry_bytes = 8388608
max_resources = 10000
max_operations = 10000
max_source_bytes = 33554432
max_record_bytes = 1048576
max_features = 100000
max_live_bytes = 536870912
max_work = 1000000000
max_commands = 1000000
max_derived_bytes = 1073741824
max_managed_bytes = 1073741824
block_size = 128
shard_features = 256
max_image_bytes = 16777216
max_dimension = 4096
object_cache_bytes = 67108864
response_memory_bytes = 16777216
response_disk_bytes = 134217728
active_http = 2
active_animation = 1
active_background = 2
queued_per_class = 8
operation_timeout_ms = 60000
max_list_items = 100
metatile_size = 2
metatile_buffer = 16
