# Temporary compatibility profile. These values are not production defaults;
# This example remains outside the G-07-approved development/small profiles.
# G-07 approval and validation scope: docs/refactor/18-g07-approved-targets.md.
listen = "127.0.0.1:3000"
public_base_url = "http://127.0.0.1:3000"
data_directory = "../assets/test/m3-server-data"
external_roots = []
backend = "gpu"

[profile]
# 20 GiB per upload and source; managed storage is a catalog-wide limit.
max_upload_bytes = 21474836480
max_expanded_bytes = 33554432
max_archive_files = 8
max_member_bytes = 16777216
max_compression_ratio = 100
max_registry_bytes = 8388608
max_resources = 10000
max_operations = 10000
max_source_bytes = 21474836480
max_record_bytes = 1048576
max_features = 100000
max_live_bytes = 40802189312
max_work = 100000000000
max_commands = 1000000
max_derived_bytes = 42949672960
max_managed_bytes = 21474836480
block_size = 2048
shard_features = 256
max_image_bytes = 16777216
max_dimension = 4096
object_cache_bytes = 8589934592
response_memory_bytes = 4294967296
response_disk_bytes = 34359738368
active_http = 8
active_animation = 1
active_background = 4
queued_per_class = 32
operation_timeout_ms = 1800000
max_feature_cursors = 128
feature_cursor_ttl_ms = 60000
max_animation_fps = 60
max_list_items = 100
metatile_size = 4
metatile_buffer = 128

# Centered WMTS prewarm square: 5 means two tiles outward in each direction.
wmts_prewarm_size = 5
