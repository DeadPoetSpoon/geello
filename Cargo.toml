[package]
name = "geello"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dead Poet Spoon <deadpoetspoon@qq.com>"]
description = "A tool to render geo data"
homepage = "https://github.com/DeadPoetSpoon/geello"
documentation = "https://docs.rs/geello/"
readme = "./README.md"
repository = "https://github.com/DeadPoetSpoon/geello"
keywords = ["gis", "geo", "map-render", "2d", "vector-graphics"]
categories = ["science::geo"]

[dependencies]
axum = { version = "0.8.9", optional = true, features = ["ws"] }
figment = { version = "0.10.19", optional = true, features = ["env", "toml"] }
foyer = { version = "0.22.3", features = ["serde"] }
geo = { version = "0.33.1", features = ["proj"] }
geo-types = { version = "0.7.19", features = ["multithreading", "rayon", "serde"] }
geojson = "1.0.0"
image = { version = "0.25.10", optional = true }
reqwest = { version = "0.13.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tiff = { version = "0.11.3", optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
vello = "0.9.0"

[features]
default = ["full"]
server = ["dep:axum", "dep:figment","dep:image","dep:tracing-subscriber"]
from_http = ["dep:reqwest"]
from_samba = []
raster = ["dep:tiff"]
full = ["server", "from_http", "from_samba", "raster"]
