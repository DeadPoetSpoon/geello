[package]
name = "geello"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Dead Poet Spoon <deadpoetspoon@qq.com>"]
description = "Deterministic geospatial scene preparation and rendering"
homepage = "https://github.com/DeadPoetSpoon/geello"
documentation = "https://docs.rs/geello/"
readme = "./README.md"
repository = "https://github.com/DeadPoetSpoon/geello"
keywords = ["gis", "map-render", "2d", "vector-graphics"]
categories = ["science::geo"]

[dependencies]
geo = { version = "=0.33.1", default-features = false }
geo-types = { version = "=0.7.20", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
geojson = { version = "=1.0.0", default-features = false, optional = true }
shapefile = { version = "=0.9.0", default-features = false, features = ["geo-types", "encoding_rs"], optional = true }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"], optional = true }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "display", "serde"], optional = true }
proj4rs = { version = "=0.3.0", default-features = false, optional = true }
proj4wkt = { version = "=0.2.0", default-features = false, optional = true }
crs-definitions = { version = "=0.6.0", default-features = false, features = ["proj4", "wkt"], optional = true }
thiserror = "=2.0.21"
rayon = { version = "=1.12.0", optional = true }
vello_cpu = { version = "=0.4.0", default-features = false, features = ["std", "text", "u8_pipeline", "multithreading"], optional = true }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["std", "wgpu", "text", "full_image_support"], optional = true }
vello_common = { version = "=0.4.0", default-features = false, features = ["std"], optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"], optional = true }
flatgeobuf = { version = "=6.0.1", default-features = false, optional = true }
flatbuffers = { version = "=24.12.23", default-features = false, features = ["std"], optional = true }
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"], optional = true }
tempfile = { version = "=3.27.0", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"], optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"], optional = true }
tower = { version = "=0.5.3", default-features = false, features = ["util"], optional = true }
moka = { version = "=0.12.16", default-features = false, features = ["sync"], optional = true }
foyer = { version = "=0.22.6", default-features = false, features = ["runtime-tokio"], optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"], optional = true }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
quick-xml = { version = "=0.42.0", default-features = false, optional = true }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"], optional = true }
proj = { version = "=0.31.0", default-features = false, optional = true }
proj-sys = { version = "=0.27.0", default-features = false, optional = true }
sha2 = { version = "=0.10.9", optional = true }

[features]
default = ["render-cpu", "render-gpu"]
render-cpu = ["dep:vello_cpu", "dep:vello_common", "dep:rayon"]
read-geojson = ["dep:geojson"]
read-shapefile = ["dep:shapefile"]
read-geotiff = ["dep:tiff"]
config-toml = ["dep:toml"]
rust-proj = ["dep:proj4rs", "dep:proj4wkt", "dep:crs-definitions"]
native-proj = ["rust-proj", "dep:proj", "dep:proj-sys", "dep:blake3", "dep:sha2"]
render-gpu = ["dep:vello_gpu", "dep:vello_common", "dep:wgpu"]
derived-store = ["dep:flatgeobuf", "dep:flatbuffers", "dep:blake3", "dep:tempfile"]
encode-images = ["dep:image"]
server = ["config-toml", "rust-proj", "derived-store", "encode-images", "text", "dep:axum", "dep:tokio", "dep:tower", "dep:moka", "dep:foyer", "dep:futures-util", "dep:zip", "dep:quick-xml"]
server-full = ["server", "read-geojson", "read-shapefile", "read-geotiff", "render-cpu", "render-gpu"]
text = ["dep:cosmic-text"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "geello"
path = "src/main.rs"
required-features = ["server"]

[patch.crates-io]
proj-sys = { path = "third_party/proj-sys" }

[[example]]
name = "m5_benchmark"
required-features = ["server", "render-cpu", "render-gpu", "read-geojson"]
